[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "allmail-mcp"
version = "0.1.0"
description = "All your mailboxes in any AI agent, over MCP. Runs locally; nothing is sent or trashed without your click."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Efe Lazut" }]
keywords = ["mcp", "email", "imap", "gmail", "icloud", "claude", "codex", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Communications :: Email",
]
dependencies = [
  "mcp>=2.3,<3",
  "imapclient>=3.0",
  "keyring>=25",
  "nh3>=0.2.17",
  "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/efelazut/mailmcp"
Issues = "https://github.com/efelazut/mailmcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "aiosmtpd>=1.4", "aioimaplib>=2.0", "pytz", "tzlocal"]

[project.scripts]
allmail-mcp = "mailmcp.cli:main"
mailmcp = "mailmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
